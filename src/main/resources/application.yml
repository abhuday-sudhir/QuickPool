spring:
  application:
    name: QuickPool

  datasource:
    url: jdbc:postgresql://localhost:5434/carpool
    username: carpool
    password: carpool
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    org.flywaydb: DEBUG

app:
  jwt:
    secret: "change-this-to-a-long-random-string-at-least-32-chars-for-production"
    access-token-minutes: 15
    refresh-token-days: 30

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus, metrics
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: carpool-backend