spring:
  application:
    name: QuickPool

  datasource:
    url: jdbc:postgresql://localhost:5434/carpool
    username: carpool
    password: carpool
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
      connect-timeout: 2s

  cache:
    type: redis

logging:
  level:
    org.flywaydb: DEBUG

app:
  jwt:
    # Never commit a real secret. Set JWT_SECRET in the environment when deploying;
    # the fallback below is development-only and the app refuses to boot with it under
    # the "prod" profile. Generate one with: openssl rand -base64 48
    secret: ${JWT_SECRET:dev-only-insecure-secret-min-32-chars-change-me}
    access-token-minutes: 15
    refresh-token-days: 30

  maps:
    # Server-side Google Directions key. Kept out of the APK deliberately: Directions is a
    # Web Service API and cannot be restricted by Android package + signing certificate, so
    # a key shipped to the client is extractable and billable by anyone. This one should
    # carry an IP restriction naming this server, and be limited to the Directions API.
    directions-key: ${MAPS_SERVER_KEY:}

  fcm:
    # Path to the Firebase service account JSON. Absent locally means push is disabled and
    # notifications are inbox-only — the app still works, it just doesn't buzz.
    credentials: ${FIREBASE_CREDENTIALS:}

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus, metrics
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: carpool-backend