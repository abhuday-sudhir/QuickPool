spring:
  application:
    name: QuickPool

  datasource:
    url: jdbc:postgresql://localhost:5434/carpool
    username: carpool
    password: carpool
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
      connect-timeout: 2s

  cache:
    type: redis

logging:
  level:
    org.flywaydb: DEBUG

app:
  jwt:
    # Never commit a real secret. Set JWT_SECRET in the environment when deploying;
    # the fallback below is development-only and the app refuses to boot with it under
    # the "prod" profile. Generate one with: openssl rand -base64 48
    secret: ${JWT_SECRET:dev-only-insecure-secret-min-32-chars-change-me}
    access-token-minutes: 15
    refresh-token-days: 30

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus, metrics
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: carpool-backend